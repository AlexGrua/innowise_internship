services:
  postgres:
    image: postgres:16
    container_name: task6_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - task6_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: task6_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: airflow_task6
    ports:
      - "27017:27017"
    volumes:
      - task6_mongo_data:/data/db
    restart: unless-stopped

  airflow-init:
    build: .
    container_name: task6_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    user: "50000:0"
    environment: &airflow_env
      AIRFLOW_UID: "50000"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./plugins:/opt/airflow/plugins
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /home/airflow/.local/bin/airflow db migrate
        && /home/airflow/.local/bin/airflow users create
        --username admin
        --password admin
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com
        || true
    restart: "no"

  airflow-webserver:
    build: .
    container_name: task6_airflow_webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    user: "50000:0"
    entrypoint: ["/bin/bash", "-c"]
    environment: *airflow_env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./plugins:/opt/airflow/plugins
    command:
      - >-
        /home/airflow/.local/bin/airflow webserver
    restart: unless-stopped

  airflow-scheduler:
    build: .
    container_name: task6_airflow_scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    user: "50000:0"
    entrypoint: ["/bin/bash", "-c"]
    environment: *airflow_env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./plugins:/opt/airflow/plugins
    command:
      - >-
        /home/airflow/.local/bin/airflow scheduler
    restart: unless-stopped

volumes:
  task6_postgres_data:
  task6_mongo_data: